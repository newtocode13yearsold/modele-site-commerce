<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Votre commerce</title>
  <meta name="description" content="Site vitrine d’un commerce de proximité : produits, horaires, adresse et contact.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header" id="top">
    <div class="wrap header-in">
      <a class="brand" href="#top" id="brand"></a>
      <nav class="nav" id="nav" aria-label="Menu principal"></nav>
      <a class="btn btn-sm header-call" id="headerCall" href="#"></a>
      <button class="burger" id="burger" aria-label="Ouvrir le menu" aria-expanded="false"></button>
    </div>
  </header>

  <main>
    <section class="hero wrap" id="hero"></section>
    <section class="highlights wrap reveal" id="highlights"></section>
    <section class="section wrap reveal" id="produits"></section>
    <section class="section about-sec reveal" id="apropos"></section>
    <section class="section wrap reveal" id="galerie"></section>
    <section class="section wrap reveal" id="avis"></section>
    <section class="section wrap reveal" id="horaires"></section>
    <section class="cta-band reveal" id="contact"></section>
  </main>

  <footer class="footer" id="footer"></footer>

  <div class="callbar" id="callbar"></div>
  <div class="demo" id="demo" hidden></div>

  <script src="config.js"></script>
  <script src="presets.js"></script>
  <script src="app.js"></script>
</body>
</html>
